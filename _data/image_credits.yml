# Canonical record of every figure used on the site (rendered on /image-credits/ and
# summarised in IMAGE_CREDITS.md). Schematic figures are generated by
# bin/research_figures.py from minimal models; they are illustrations, not research data.

- id: dwave
  kind: schematic
  title: d-wave gap on a square-lattice Fermi surface
  file: /assets/img/research/schematic-dwave-figure.webp
  card: /assets/img/research/schematic-dwave-card.webp
  alt: >-
    Brillouin zone of a square-lattice tight-binding model showing the Fermi contour coloured blue and teal
    by the sign of the d_{x^2-y^2} gap form factor, which vanishes on the dashed zone diagonals.
  caption: >-
    Schematic model visualization. Fermi contour of ε(k) = −2t(cos k<sub>x</sub> + cos k<sub>y</sub>) − 4t′ cos k<sub>x</sub> cos k<sub>y</sub> − μ
    with t′/t = −0.3 at filling n = 0.85, coloured by the d<sub>x²−y²</sub> form factor
    Δ(k) = Δ₀(cos k<sub>x</sub> − cos k<sub>y</sub>). Dashed lines mark the nodal diagonals.
  author: Sarbajit Mazumdar
  source: bin/research_figures.py (this repository)
  modifications: Original figure.

- id: altermagnet
  kind: schematic
  title: Spin-split Fermi surfaces of a d-wave altermagnet
  file: /assets/img/research/schematic-altermagnet-figure.webp
  card: /assets/img/research/schematic-altermagnet-card.webp
  alt: >-
    Two Fermi contours around the zone centre, one elongated along k_x (spin up, blue) and one along k_y
    (spin down, teal), crossing on the zone diagonals where the spin splitting vanishes.
  caption: >-
    Schematic model visualization. Simplified d<sub>x²−y²</sub>-type altermagnet,
    E<sub>↑/↓</sub>(k) = −2t(cos k<sub>x</sub> + cos k<sub>y</sub>) − μ ± λ(cos k<sub>x</sub> − cos k<sub>y</sub>) with λ/t = 0.6, μ/t = −2.4.
    The spin splitting vanishes on the zone diagonals.
  author: Sarbajit Mazumdar
  source: bin/research_figures.py (this repository)
  modifications: Original figure.

- id: chern-ribbon
  kind: schematic
  title: Chiral edge modes of a Chern-insulator ribbon
  file: /assets/img/research/schematic-chern-ribbon-figure.webp
  card: /assets/img/research/schematic-chern-ribbon-card.webp
  alt: >-
    Energy spectrum of a ribbon versus momentum k_x showing grey bulk bands separated by a gap that is
    crossed by two edge modes, blue for the upper edge and teal for the lower edge.
  caption: >-
    Schematic model visualization. Spectrum of the Qi–Wu–Zhang Chern-insulator model (m = 1, Chern number 1)
    on a ribbon 40 sites wide. Colour marks localisation on the upper (blue) or lower (teal) edge; each edge
    hosts one chiral mode crossing the bulk gap.
  author: Sarbajit Mazumdar
  source: bin/research_figures.py (this repository)
  modifications: Original figure.

